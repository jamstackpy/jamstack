[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jamstack"
dynamic = ["version"]
description = "Static site generator built on Python and Jinja"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Abdur-Rahmaan Janhangeer", email = "arj.python@gmail.com" },
    { name = "Pedro Torcatt", email = "pedrotorcattsoto@gmail.com" },
]
keywords = ["static site generator", "jinja", "python", "ssg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.scripts]
jamstack = "jamstack.cli:main"

[project.optional-dependencies]
dev = [
    "commitizen>=4.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "zensical>=0.1",
]

[project.urls]
Homepage = "https://github.com/jamstackpy/jamstack"
Source = "https://github.com/jamstackpy/jamstack"
Issues = "https://github.com/jamstackpy/jamstack/issues"
Changelog = "https://github.com/jamstackpy/jamstack/blob/stable/CHANGELOG.md"

[tool.hatch.version]
path = "src/jamstack/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jamstack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["jamstack"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_files = ["src/jamstack/__about__.py"]
update_changelog_on_bump = true
change_type_order = ["BREAKING CHANGE", "Features", "Bug fixes", "Performance", "Refactoring", "Reverts"]
change_type_map = { feat = "Features", fix = "Bug fixes", perf = "Performance", refactor = "Refactoring", revert = "Reverts" }
