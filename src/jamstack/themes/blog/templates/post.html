{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ site.title }}{% endblock %}

{% block content %}
  <article class="post">
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      {% if page.date %}<time datetime="{{ page.date.isoformat() }}">{{ page.date.strftime("%d-%m-%Y") }}</time>{% endif %}
    </header>
    <div class="prose">{{ page.content }}</div>
    {% block post_footer %}
      <p class="back"><a href="/">← All posts</a></p>
    {% endblock %}
  </article>
{% endblock %}
