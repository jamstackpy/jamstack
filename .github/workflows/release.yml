name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Check version matches tag
        run: |
          python -c "import jamstack, os; assert jamstack.__version__ == os.environ['GITHUB_REF_NAME'].lstrip('v'), jamstack.__version__"
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" 'index($0, "## " ver " (") == 1 || $0 == "## " ver { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            | sed "s#(docs/#(https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/#g" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          prerelease=()
          case "$version" in
            *rc[0-9]*|*a[0-9]*|*b[0-9]*|*dev[0-9]*) prerelease=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${prerelease[@]}"
          fi
