name: Feature request
description: Suggest an improvement to the engine, the CLI, the themes or the docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the implementation. What are you doing today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like jamstack to do? A `site.toml` key, a CLI flag, a template variable?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried.
  - type: dropdown
    id: area
    attributes:
      label: Where does it apply?
      multiple: true
      options:
        - Command line
        - Build engine
        - Theme format
        - Bundled themes
        - Documentation
        - Other
    validations:
      required: true
